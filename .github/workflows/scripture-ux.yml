name: Scripture Explorer UX acceptance
on:
  push:
    paths:
      - 'psalms.html'
      - 'index.html'
      - 'daily-prayer.html'
      - 'assets/psalm-explorer*.mjs'
      - 'assets/psalm-explorer.css'
      - 'scripts/psalms*.mjs'
      - '.github/workflows/scripture-ux.yml'
  pull_request:
    paths:
      - 'psalms.html'
      - 'index.html'
      - 'daily-prayer.html'
      - 'assets/psalm-explorer*.mjs'
      - 'assets/psalm-explorer.css'
      - 'scripts/psalms*.mjs'
      - '.github/workflows/scripture-ux.yml'

permissions:
  contents: read

jobs:
  psalms-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete native FaithHub regression suite
        run: node --test scripts/*.test.mjs
      - name: Install browser harness
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.0
      - name: Check Vite build does not inject third-party code into private reflections
        shell: bash
        run: |
          npm run build
          test -f dist/psalms.html
          if grep -q 'podcast-launcher-v3.js' dist/psalms.html; then
            echo 'Private Psalm reflections exposed to third-party launcher'
            exit 1
          fi
          grep -q 'psalm-explorer.mjs' psalms.html
      - name: Install Chromium for real mobile and desktop acceptance
        run: npx playwright install --with-deps chromium
      - name: Test the deployed static HTML interaction in Chromium
        run: node scripts/psalms-browser.mjs
      - name: Upload synthetic QA screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psalms-ux-qa
          path: |
            psalms-mobile-qa.png
            psalms-desktop-qa.png
          if-no-files-found: ignore
          retention-days: 7
