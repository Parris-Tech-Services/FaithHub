name: Cornerstone source audio diagnostics
on:
  push:
    branches: [feat/cornerstone-underlying-audio-recovery-20261031]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create public-only catalogue
        run: python3 scripts/build-cornerstone-catalogue.py --output cornerstone-episodes.json --require-at-least 115
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real iframe manual click diagnostic
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/audio-web.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node scripts/cornerstone-iframe-diagnostic.mjs

      - name: Verify each publisher-hosted direct audio stream progresses five seconds
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/audio-web.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node scripts/cornerstone-direct-audio-e2e.mjs
      - name: Save public source test results without audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cornerstone-direct-stream-playback
          path: cornerstone-direct-audio-test-results.json
          if-no-files-found: ignore
          retention-days: 30
