name: FaithHub Mobile UX Regression

on:
  pull_request:
    paths:
      - index.html
      - .github/workflows/deploy.yml
      - .github/workflows/faithhub-ux.yml
      - scripts/ux-audit-2026-10-29.test.mjs
      - scripts/ux-mobile-browser.cjs
      - intercessions.html
      - assets/intercession.mjs
      - scripts/intercession-browser.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All FaithHub source tests
        run: node --test scripts/*.test.mjs
      - name: Install temporary browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Compile secondary Vite / React site
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Headless mobile and desktop acceptance tests
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/faithhub-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/ux-mobile-browser.cjs
          node scripts/podcast-unified-browser.mjs
          node scripts/intercession-browser.mjs
      - name: Store the 390px mobile verification screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faithhub-mobile-ux-390px
          path: test-results/faithhub-mobile-390.png
          if-no-files-found: ignore
