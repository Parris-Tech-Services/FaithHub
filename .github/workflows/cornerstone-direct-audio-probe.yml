name: Cornerstone public direct MP3 delivery probe
on:
  push:
    branches: [feat/cornerstone-all-public-audio-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check whether public Drive can supply actual streaming MP3 bytes and range requests
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse
          id='13N5scRPE3iDD3Gd_c-7kzY-ukpGIzOYn'
          urls=[
           f'https://drive.usercontent.google.com/download?id={id}&export=download&confirm=t',
           f'https://drive.google.com/uc?export=download&id={id}',
           f'https://drive.google.com/uc?id={id}&export=download&confirm=t',
          ]
          for url in urls:
           try:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Range':'bytes=0-1023'})
            with urllib.request.urlopen(req,timeout=24) as r:
             h=r.read(64)
             print('SOURCE',url.split('/')[2], 'HTTP',r.status,'TYPE',r.headers.get('Content-Type'),'RANGE',r.headers.get('Content-Range'),'ACCEPT_RANGE',r.headers.get('Accept-Ranges'),'MAGIC',h[:16].hex(),'URL',r.url.split('/')[2])
           except Exception as ex: print('SOURCE',url.split('/')[2],'ERROR',str(ex)[:170])
          PY
