name: Cornerstone Mixcloud source verification
on:
  push:
    branches: [feat/cornerstone-mixcloud-private-drive-player-20261031]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-mixcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check public publisher-owned Mixcloud catalogue metadata
        run: |
          python3 - <<'PY'
          import json,urllib.request
          u='https://api.mixcloud.com/cornerstonecommunitypodcast/cloudcasts/?limit=100'
          try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  data=json.load(r)
              print('MIXCLOUD_HTTP_SUCCESS')
              print('MIXCLOUD_EPISODE_COUNT',len(data.get('data',[])))
              for item in data.get('data',[])[:8]:
                  print('MIXCLOUD_SAMPLE',item.get('name'),item.get('key'),item.get('url'))
              print('MIXCLOUD_HAS_NEXT',bool(data.get('paging',{}).get('next')))
          except Exception as e:
              print('MIXCLOUD_UNAVAILABLE',type(e).__name__,str(e)[:250])
          PY
      - name: Merge public Mixcloud with RSS and report verified source coverage
        run: |
          python3 scripts/build-cornerstone-catalogue.py --output /tmp/cornerstone-mixcloud-episodes.json --require-at-least 115
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/cornerstone-mixcloud-episodes.json'))
          from collections import Counter
          print('MIXCLOUD_MERGED_COUNT',d['mixcloud'])
          print('MIXCLOUD_FINAL_MODES',dict(Counter(x['mode'] for x in d['episodes'])))
          print('MIXCLOUD_TRACKS',len(d['episodes']))
          print('MIXCLOUD_UNRECOVERED',[(e['title'],e['id']) for e in d['episodes'] if e['mode']=='unavailable'])
          print('MIXCLOUD_EXTRA_UPLOADS',[e['title'] for e in d['episodes'] if ':mixcloud:' in e['id']])
          import urllib.request
          one=next((e for e in d['episodes'] if e['mode']=='mixcloud'),None)
          if one:
            try:
              with urllib.request.urlopen(urllib.request.Request(one['embed'],headers={'User-Agent':'Mozilla/5.0'}),timeout=15) as resp:
                print('MIXCLOUD_WIDGET_STATUS',resp.status,resp.headers.get('Content-Type'),resp.url)
            except Exception as ex: print('MIXCLOUD_WIDGET_ERROR',type(ex).__name__,str(ex)[:150])
          PY
