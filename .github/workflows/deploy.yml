name: Deploy FaithHub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify prayer practice and inline scripts
        run: node --test scripts/*.test.mjs

      - name: Prepare static site with podcasts in normal page flow
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='_site' ./ _site/
          python - <<'PY'
          from pathlib import Path
          import re

          # A fixed-position shortcut previously covered tabs and other controls on mobile.
          # Keep the entry point reachable and visible, but never overlay page content.
          podcast_nav = (
              '<nav id="faithhub-podcast-shortcut" aria-label="Faith podcasts" '
              'style="display:block;margin:0 0 16px">'
              '<a href="./podcasts.html" style="display:inline-flex;align-items:center;'
              'justify-content:center;min-height:48px;min-width:135px;'
              'border:2px solid #fff;border-radius:12px;padding:10px 16px;'
              'background:#111827;color:#fff;font:700 15px/1.4 system-ui,sans-serif;'
              'text-decoration:none">Faith podcasts</a></nav>\n'
          )

          for path in Path('_site').glob('*.html'):
              if path.name in ('podcasts.html','psalms.html'):
                  continue
              html = path.read_text(encoding='utf-8')
              if 'faithhub-podcast-button' in html:
                  raise SystemExit(f'{path}: obsolete floating podcast button remains')
              if 'href="podcasts.html"' in html or 'href="./podcasts.html"' in html:
                  # The page already has a conventional, visible link.
                  continue
              if not re.search(r'<main(?:\s[^>]*)?>', html, re.I):
                  raise SystemExit(f'{path}: no <main> landmark found')
              html = re.sub(r'(<main(?:\s[^>]*)?>)', lambda m: m.group(1) + '\n' + podcast_nav, html, count=1, flags=re.I)
              path.write_text(html, encoding='utf-8')
              print(f'Added in-flow podcasts navigation to {path}')
          PY

          test -f _site/psalms.html
          test -f _site/assets/psalm-explorer.mjs
          grep -q 'href="psalms.html"' _site/index.html
          test -f _site/prayer-practice.html
          grep -q 'href="prayer-practice.html"' _site/index.html
          test -f _site/docs/prayer/john-mark-comer-talking-with-god-2026-10-29.md
          test -f _site/podcasts.html
          grep -q 'href="podcasts.html"' _site/index.html
          grep -q 'id="faithhub-podcast-shortcut"' _site/prayer-practice.html
          ! grep -q 'faithhub-podcast-button' _site/index.html
          grep -q 'Faith podcasts' _site/podcasts.html
          test -f _site/cornerstone-teachings.html
          grep -q 'href="cornerstone-teachings.html"' _site/index.html
          grep -q 'Cornerstone Teachings' _site/cornerstone-teachings.html

      - name: Resolve all publicly available Cornerstone podcast episodes
        shell: bash
        run: |
          python3 scripts/build-cornerstone-catalogue.py --output _site/cornerstone-episodes.json --require-at-least 100
          python3 - <<'PY'
          import json
          data=json.load(open('_site/cornerstone-episodes.json'))
          counts={str(x['showId']):x['playableEnclosuresFound'] for x in data['shows']}
          assert counts['293630407'] >= 90, counts
          assert counts['1631726711'] >= 15, counts
          assert counts['1631658757'] >= 1, counts
          assert all(e['embed'].startswith('https://') for e in data['episodes'])
          print('Published individual streaming audio entries:',len(data['episodes']))
          PY

      - name: Bind generated public pages to this exact Git source SHA
        shell: bash
        env:
          DEPLOY_SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          sha=os.environ["DEPLOY_SOURCE_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}",sha)
          for filename in ("index.html", "psalms.html", "cornerstone-teachings.html", "backup.html"):
              p=Path("_site")/filename
              html=p.read_text(encoding="utf-8")
              assert re.search(r"<head\s*>",html,re.I),filename
              tag=f'<meta name="faithhub-deploy-sha" content="{sha}">'
              assert "faithhub-deploy-sha" not in html, "Do not overwrite an unverified source marker"
              html=re.sub(r"<head\s*>",lambda m: m.group(0)+"\n"+tag,html,count=1,flags=re.I)
              p.write_text(html,encoding="utf-8")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
