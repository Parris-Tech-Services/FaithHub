name: Deploy FaithHub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify prayer practice and inline scripts
        run: node --test scripts/*.test.mjs

      - name: Prepare static site with native podcast button
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='_site' ./ _site/
          python - <<'PY'
          from pathlib import Path

          button = '''\n  <style id="faithhub-podcast-button-style">\n    #faithhub-podcast-button{position:fixed;z-index:2147483000;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:inline-flex;align-items:center;justify-content:center;min-width:172px;max-width:calc(100vw - 24px);padding:13px 20px;border:2px solid #fff;border-radius:999px;background:#111827;color:#fff;text-decoration:none;font:800 15px/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 12px 34px rgba(0,0,0,.55)}\n    #faithhub-podcast-button:focus-visible{outline:3px solid #38bdf8;outline-offset:3px}\n    @media(max-width:520px){#faithhub-podcast-button{bottom:max(12px,env(safe-area-inset-bottom));width:auto}}\n  </style>\n  <a id="faithhub-podcast-button" href="./podcasts.html" aria-label="Open FaithHub podcasts">Podcasts</a>\n'''

          for path in Path('_site').glob('*.html'):
              if path.name in ('podcasts.html','psalms.html'):
                  continue
              html = path.read_text(encoding='utf-8')
              if 'faithhub-podcast-button' in html:
                  continue
              if '</body>' not in html:
                  raise SystemExit(f'{path} has no </body> tag')
              path.write_text(html.replace('</body>', button + '</body>', 1), encoding='utf-8')
              print(f'Injected native podcast button into {path}')
          PY

          test -f _site/prayer-practice.html
          test -f _site/psalms.html
          test -f _site/assets/psalm-explorer.mjs
          grep -q 'href="psalms.html"' _site/index.html
          grep -q 'href="prayer-practice.html"' _site/index.html
          test -f _site/docs/prayer/john-mark-comer-talking-with-god-2026-10-29.md
          test -f _site/podcasts.html
          grep -q 'id="faithhub-podcast-button"' _site/index.html
          grep -q 'href="./podcasts.html"' _site/index.html
          grep -q 'Faith podcasts' _site/podcasts.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
